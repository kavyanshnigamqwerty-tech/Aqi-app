<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroGlass - AQI Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="glass-container">
        <h1 class="title">Air Quality Index</h1>
        
        <div id="aqi-display">
            <p class="message">Allow location access to check your local air quality.</p>
        </div>

        <button id="check-btn" onclick="getLocation()">Check My Area</button>
        
        <div class="footer-info">
            <p>Stay Safe. Breathe Clean.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
